<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>My Account — Major Rangas</title>
  <link rel="icon" href="/images/logo.png"><link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}html,body{margin:0!important;padding:0!important;}
    :root{--terra:#C4511A;--terra-dark:#A03D10;--gold:#D4A017;--gold-light:#F0C040;--cream:#FDF6EC;--cream2:#F5ECD8;--cream3:#EDD9B8;--brown:#2C1506;--brown2:#5C3010;--text:#1A0800;--text2:#5C3010;--text3:#9B6B3A;--border:#D4B896;--border2:#E8D5B4;--white:#FFFDF8;--font-serif:'Playfair Display',Georgia,serif;--font-sans:'Inter',sans-serif;--shadow:0 2px 12px rgba(44,21,6,0.08);--shadow-md:0 6px 28px rgba(44,21,6,0.14);}
    body{background:var(--cream);color:var(--text);font-family:var(--font-sans);min-height:100vh;}
    a{text-decoration:none;color:inherit;}
    .top-stripe{position:fixed;top:0;left:0;right:0;height:4px;z-index:1001;background:repeating-linear-gradient(90deg,var(--terra) 0,var(--terra) 30px,var(--gold) 30px,var(--gold) 60px);}
    .navbar{background:var(--brown);position:fixed;top:4px;left:0;right:0;z-index:999;box-shadow:var(--shadow);}
    .nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 32px;}
    .logo-img{height:38px;background:#1A0800;padding:5px 14px;border-radius:6px;}
    .nav-links a{color:rgba(253,246,236,0.55);font-size:0.78rem;letter-spacing:1px;text-transform:uppercase;font-weight:500;margin-left:20px;transition:color 0.2s;}
    .nav-links a:hover{color:var(--gold-light);}
    .account-wrap{max-width:1100px;margin:0 auto;padding:90px 24px 60px;display:grid;grid-template-columns:260px 1fr;gap:24px;}
    /* SIDEBAR */
    .user-card{background:var(--brown);padding:24px;text-align:center;margin-bottom:12px;border-left:4px solid var(--terra);}
    .user-avatar{width:72px;height:72px;border-radius:50%;background:var(--terra);color:var(--cream);font-family:var(--font-serif);font-size:1.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
    .user-name{font-weight:700;font-size:1rem;color:var(--gold-light);margin-bottom:3px;}
    .user-email{color:rgba(253,246,236,0.4);font-size:0.78rem;}
    .side-nav{background:var(--white);border:1px solid var(--border2);}
    .side-nav-item{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;font-size:0.85rem;color:var(--text2);border-bottom:1px solid var(--border2);transition:all 0.2s;font-weight:500;}
    .side-nav-item:last-child{border-bottom:none;}
    .side-nav-item:hover{background:var(--cream2);color:var(--terra);}
    .side-nav-item.active{background:rgba(196,81,26,0.06);color:var(--terra);font-weight:600;border-left:3px solid var(--terra);}
    .logout-item{color:#E53935!important;}
    .logout-item:hover{background:#FFF0F0!important;}
    /* CONTENT */
    .content-area{background:var(--white);border:1px solid var(--border2);padding:28px;}
    .section{display:none;}.section.active{display:block;}
    .section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--border2);}
    .section-hd h2{font-family:var(--font-serif);font-size:1.4rem;color:var(--brown);}
    /* ORDERS */
    .order-card{border:1px solid var(--border2);padding:18px;margin-bottom:14px;border-left:3px solid transparent;transition:all 0.2s;}
    .order-card:hover{border-left-color:var(--terra);}
    .order-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .order-num{color:var(--terra);font-weight:700;font-size:0.9rem;font-family:var(--font-serif);}
    .order-date{color:var(--text3);font-size:0.72rem;margin-top:2px;}
    .order-badge{padding:4px 12px;font-size:0.68rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
    .badge-placed{background:rgba(212,160,23,0.1);color:var(--gold);}
    .badge-confirmed{background:rgba(196,81,26,0.1);color:var(--terra);}
    .badge-shipped{background:rgba(103,58,183,0.1);color:#6732C9;}
    .badge-delivered{background:rgba(56,142,60,0.1);color:#388E3C;}
    .order-items-text{color:var(--text2);font-size:0.82rem;margin-bottom:12px;}
    .order-bottom{display:flex;align-items:center;justify-content:space-between;}
    .order-total{font-weight:700;font-size:1rem;color:var(--brown);font-family:var(--font-serif);}
    .btn-sm{padding:7px 16px;font-size:0.72rem;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;letter-spacing:1px;text-transform:uppercase;}
    .btn-sm-outline{border:1.5px solid var(--border);background:none;color:var(--text2);}
    .btn-sm-outline:hover{border-color:var(--terra);color:var(--terra);}
    .btn-sm-terra{background:var(--terra);color:#fff;}
    /* PROFILE + FORMS */
    .inp-group{margin-bottom:16px;}
    .inp-group label{display:block;font-size:0.65rem;font-weight:700;color:var(--text3);margin-bottom:5px;letter-spacing:2px;text-transform:uppercase;}
    .inp{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:4px;font-size:0.88rem;color:var(--text);outline:none;font-family:var(--font-sans);background:var(--cream);transition:border-color 0.2s;}
    .inp:focus{border-color:var(--terra);background:var(--white);}
    .inp:disabled{opacity:0.5;cursor:not-allowed;}
    .btn-save{background:var(--terra);color:#fff;border:none;padding:12px 28px;font-weight:700;font-size:0.78rem;cursor:pointer;letter-spacing:1.5px;text-transform:uppercase;}
    .btn-save:hover{background:var(--terra-dark);}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    /* WISHLIST */
    .wish-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
    .wish-card{border:1px solid var(--border2);overflow:hidden;background:var(--white);}
    .wish-img{aspect-ratio:1;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:2.5rem;position:relative;overflow:hidden;}
    .wish-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
    .wish-remove{position:absolute;top:8px;right:8px;background:rgba(44,21,6,0.6);border:none;color:#fff;width:26px;height:26px;cursor:pointer;font-size:0.85rem;display:flex;align-items:center;justify-content:center;}
    .wish-info{padding:12px;}
    .wish-name{font-size:0.85rem;font-weight:600;color:var(--brown);margin-bottom:3px;}
    .wish-price{color:var(--terra);font-weight:700;font-size:0.9rem;margin-bottom:8px;font-family:var(--font-serif);}
    .wish-add{width:100%;background:var(--terra);color:#fff;border:none;padding:8px;font-size:0.72rem;font-weight:700;cursor:pointer;letter-spacing:1.5px;text-transform:uppercase;}
    /* ADDRESSES */
    .addr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
    .addr-card{border:1.5px solid var(--border2);padding:16px;position:relative;transition:all 0.2s;}
    .addr-card.default{border-color:var(--terra);background:rgba(196,81,26,0.03);}
    .addr-default-badge{position:absolute;top:10px;right:10px;background:var(--terra);color:#fff;font-size:0.6rem;font-weight:700;padding:2px 8px;letter-spacing:1px;text-transform:uppercase;}
    .addr-name{font-weight:700;font-size:0.9rem;color:var(--brown);margin-bottom:5px;}
    .addr-text{color:var(--text2);font-size:0.82rem;line-height:1.7;}
    .addr-actions{display:flex;gap:8px;margin-top:10px;}
    .btn-del{background:none;border:1px solid rgba(229,57,53,0.3);color:#E53935;padding:5px 14px;font-size:0.72rem;cursor:pointer;}
    .add-addr-form{background:var(--cream2);border:1px solid var(--border2);padding:20px;margin-top:14px;}
    .add-addr-form .grid-2{margin-bottom:10px;}
    .form-inp{width:100%;padding:10px 14px;border:1.5px solid var(--border);background:var(--white);font-size:0.85rem;color:var(--text);outline:none;font-family:var(--font-sans);}
    .form-inp:focus{border-color:var(--terra);}
    .empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
    .empty-state .icon{font-size:3rem;margin-bottom:12px;}
    .empty-state a{color:var(--terra);font-weight:600;}
    .toast{position:fixed;bottom:28px;right:28px;background:var(--brown);color:var(--cream);padding:12px 20px;border-radius:4px;border-left:3px solid var(--terra);font-size:0.85rem;z-index:9999;transform:translateY(80px);opacity:0;transition:all 0.3s;}
    .toast.show{transform:translateY(0);opacity:1;}
    .wa-float{position:fixed;bottom:28px;right:28px;background:#25D366;color:#fff;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;z-index:5000;box-shadow:0 4px 16px rgba(37,211,102,0.4);text-decoration:none;}
    @media(max-width:768px){.account-wrap{grid-template-columns:1fr;padding:80px 16px 40px;}.wish-grid{grid-template-columns:1fr 1fr;}.addr-grid{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div class="top-stripe"></div>
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html"><img src="/images/logo.png" alt="Major Rangas" class="logo-img"></a>
    <div class="nav-links">
      <a href="products.html">Shop</a>
      <a href="track.html">Track Order</a>
      <a href="index.html">Home</a>
    </div>
  </div>
</nav>

<div class="account-wrap">
  <aside>
    <div class="user-card">
      <div class="user-avatar" id="userAvatar">V</div>
      <div class="user-name" id="userName">Loading...</div>
      <div class="user-email" id="userEmail"></div>
    </div>
    <div class="side-nav">
      <div class="side-nav-item active" onclick="showSec('orders',this)">📦 My Orders</div>
      <div class="side-nav-item" onclick="showSec('wishlist',this)">❤️ Wishlist</div>
      <div class="side-nav-item" onclick="showSec('addresses',this)">📍 Addresses</div>
      <div class="side-nav-item" onclick="showSec('profile',this)">👤 Profile</div>
      <div class="side-nav-item logout-item" onclick="doLogout()">🚪 Logout</div>
    </div>
  </aside>

  <div class="content-area">
    <div class="section active" id="sec-orders">
      <div class="section-hd"><h2>My Orders</h2></div>
      <div id="ordersList"><div class="empty-state"><div class="icon">📦</div><p>Loading orders...</p></div></div>
    </div>
    <div class="section" id="sec-wishlist">
      <div class="section-hd"><h2>My Wishlist</h2></div>
      <div class="wish-grid" id="wishGrid"></div>
    </div>
    <div class="section" id="sec-addresses">
      <div class="section-hd"><h2>Saved Addresses</h2><button class="btn-save" onclick="toggleAddrForm()" style="font-size:0.72rem;padding:9px 18px">+ Add New</button></div>
      <div class="addr-grid" id="addrGrid"></div>
      <div class="add-addr-form" id="addAddrForm" style="display:none">
        <div class="grid-2">
          <div><label style="font-size:0.65rem;color:var(--text3);display:block;margin-bottom:4px;letter-spacing:2px;text-transform:uppercase">Name</label><input class="form-inp" id="addrName" placeholder="Full name"></div>
          <div><label style="font-size:0.65rem;color:var(--text3);display:block;margin-bottom:4px;letter-spacing:2px;text-transform:uppercase">Phone</label><input class="form-inp" id="addrPhone" placeholder="Phone number"></div>
        </div>
        <div style="margin-bottom:10px"><label style="font-size:0.65rem;color:var(--text3);display:block;margin-bottom:4px;letter-spacing:2px;text-transform:uppercase">Address</label><textarea class="form-inp" id="addrAddress" rows="2" placeholder="House no, Street, Area"></textarea></div>
        <div class="grid-2" style="margin-bottom:12px">
          <div><label style="font-size:0.65rem;color:var(--text3);display:block;margin-bottom:4px;letter-spacing:2px;text-transform:uppercase">City</label><input class="form-inp" id="addrCity" placeholder="City"></div>
          <div><label style="font-size:0.65rem;color:var(--text3);display:block;margin-bottom:4px;letter-spacing:2px;text-transform:uppercase">State</label><input class="form-inp" id="addrState" placeholder="State"></div>
          <div><label style="font-size:0.65rem;color:var(--text3);display:block;margin-bottom:4px;letter-spacing:2px;text-transform:uppercase">Pincode</label><input class="form-inp" id="addrPin" placeholder="Pincode"></div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--text2);margin-bottom:14px;cursor:pointer"><input type="checkbox" id="addrDefault"> Set as default address</label>
        <button class="btn-save" onclick="saveAddr()">Save Address</button>
      </div>
    </div>
    <div class="section" id="sec-profile">
      <div class="section-hd"><h2>My Profile</h2></div>
      <div class="grid-2">
        <div class="inp-group"><label>Full Name</label><input class="inp" id="profName" type="text"></div>
        <div class="inp-group"><label>Phone Number</label><input class="inp" id="profPhone" type="tel"></div>
      </div>
      <div class="inp-group" style="margin-bottom:20px"><label>Email Address</label><input class="inp" id="profEmail" type="email" disabled></div>
      <button class="btn-save" onclick="saveProfile()">Save Changes →</button>
    </div>
  </div>
</div>

<a href="https://wa.me/919500865686" target="_blank" class="wa-float">💬</a>
<div class="toast" id="toast"></div>

<script>
var API='https://majorrangas-backend-production.up.railway.app';
var token=localStorage.getItem('mr_customer_token');
var customer=JSON.parse(localStorage.getItem('mr_customer')||'{}');
if(!token)window.location.href='login.html';
function authH(){return{'Content-Type':'application/json','Authorization':'Bearer '+token};}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}
function initUser(){document.getElementById('userName').textContent=customer.name||'User';document.getElementById('userEmail').textContent=customer.email||'';var av=document.getElementById('userAvatar');if(customer.name)av.textContent=customer.name.charAt(0).toUpperCase();}
function showSec(sec,el){document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});document.querySelectorAll('.side-nav-item').forEach(function(i){i.classList.remove('active');});document.getElementById('sec-'+sec).classList.add('active');if(el)el.classList.add('active');if(sec==='orders')loadOrders();if(sec==='wishlist')loadWishlist();if(sec==='addresses')loadAddresses();if(sec==='profile')loadProfile();}
async function loadOrders(){
  try{
    var res=await fetch(API+'/api/customers/orders',{headers:authH()});
    var data=await res.json();
    var el=document.getElementById('ordersList');
    if(!data.success||!data.orders.length){el.innerHTML='<div class="empty-state"><div class="icon">📦</div><p>No orders yet</p><a href="products.html">Start Shopping →</a></div>';return;}
    el.innerHTML=data.orders.map(function(o){
      var items=typeof o.items==='string'?JSON.parse(o.items):o.items;
      var names=items.map(function(i){return i.name+' x'+i.quantity;}).join(', ');
      return '<div class="order-card">'
        +'<div class="order-top"><div><div class="order-num">'+o.order_number+'</div><div class="order-date">'+new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+'</div></div>'
        +'<span class="order-badge badge-'+(o.order_status||'placed')+'">'+o.order_status+'</span></div>'
        +'<div class="order-items-text">'+names+'</div>'
        +'<div class="order-bottom"><div class="order-total">₹'+parseFloat(o.total_amount).toFixed(2)+'</div>'
        +'<div style="display:flex;gap:8px"><button class="btn-sm btn-sm-outline" onclick="window.location.href=\'track.html?order='+o.order_number+'\'">Track</button>'
        +'<a href="'+API+'/api/invoice/'+o.order_number+'" target="_blank" class="btn-sm btn-sm-terra" style="text-decoration:none">Invoice</a></div></div></div>';
    }).join('');
  }catch(e){document.getElementById('ordersList').innerHTML='<div class="empty-state"><div class="icon">⚠️</div><p>Failed to load</p></div>';}
}
async function loadWishlist(){
  try{
    var res=await fetch(API+'/api/customers/wishlist',{headers:authH()});
    var data=await res.json();
    var grid=document.getElementById('wishGrid');
    if(!data.success||!data.wishlist.length){grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="icon">❤️</div><p>Wishlist empty</p><a href="products.html">Browse Products →</a></div>';return;}
    var emoji=function(c){return c==='Sweets'?'🍬':c==='Podis'?'🌶️':'🥨';};
    grid.innerHTML=data.wishlist.map(function(p){
      var price=parseFloat(p.sale_price||p.mrp);
      return '<div class="wish-card"><div class="wish-img">'+(p.image_primary?'<img src="'+p.image_primary+'" alt="'+p.name+'">':emoji(p.category))
        +'<button class="wish-remove" onclick="removeWish('+p.product_id+')">✕</button></div>'
        +'<div class="wish-info"><div class="wish-name">'+p.name+'</div><div class="wish-price">₹'+price.toFixed(0)+'</div>'
        +'<button class="wish-add" onclick="quickAddCart('+p.product_id+',\''+p.name.replace(/'/g,'')+'\',' +price+',\''+( p.image_primary||'')+'\',\''+p.category+'\')">Add to Cart</button></div></div>';
    }).join('');
  }catch(e){}
}
function quickAddCart(id,name,price,img,cat){var cart=JSON.parse(localStorage.getItem('mr_cart')||'[]');var ex=cart.find(function(i){return i.id===id;});if(ex)ex.quantity++;else cart.push({id:id,name:name,mrp:price,image_primary:img,category:cat,quantity:1});localStorage.setItem('mr_cart',JSON.stringify(cart));showToast(name+' added to cart!');}
async function removeWish(id){await fetch(API+'/api/customers/wishlist/'+id,{method:'DELETE',headers:authH()});showToast('Removed from wishlist');loadWishlist();}
async function loadAddresses(){
  try{
    var res=await fetch(API+'/api/customers/addresses',{headers:authH()});
    var data=await res.json();
    var grid=document.getElementById('addrGrid');
    if(!data.success||!data.addresses.length){grid.innerHTML='<div style="color:var(--text3);font-size:0.85rem;grid-column:1/-1">No saved addresses yet</div>';return;}
    grid.innerHTML=data.addresses.map(function(a){return '<div class="addr-card'+(a.is_default?' default':'')+'">'+( a.is_default?'<div class="addr-default-badge">Default</div>':'')+'<div class="addr-name">'+a.name+'</div><div class="addr-text">'+a.address+'<br>'+a.city+', '+a.state+' - '+a.pincode+'<br>📞 '+a.phone+'</div><div class="addr-actions"><button class="btn-del" onclick="delAddr('+a.id+')">Delete</button></div></div>';}).join('');
  }catch(e){}
}
function toggleAddrForm(){var f=document.getElementById('addAddrForm');f.style.display=f.style.display==='none'?'block':'none';}
async function saveAddr(){
  var payload={name:document.getElementById('addrName').value,phone:document.getElementById('addrPhone').value,address:document.getElementById('addrAddress').value,city:document.getElementById('addrCity').value,state:document.getElementById('addrState').value,pincode:document.getElementById('addrPin').value,is_default:document.getElementById('addrDefault').checked};
  if(!payload.name||!payload.address||!payload.city){showToast('Please fill all fields');return;}
  try{var res=await fetch(API+'/api/customers/addresses',{method:'POST',headers:authH(),body:JSON.stringify(payload)});var data=await res.json();if(data.success){showToast('Address saved!');toggleAddrForm();loadAddresses();}else showToast('Failed to save');}catch(e){showToast('Error');}
}
async function delAddr(id){if(!confirm('Delete this address?'))return;await fetch(API+'/api/customers/addresses/'+id,{method:'DELETE',headers:authH()});showToast('Deleted');loadAddresses();}
function loadProfile(){document.getElementById('profName').value=customer.name||'';document.getElementById('profEmail').value=customer.email||'';document.getElementById('profPhone').value=customer.phone||'';}
async function saveProfile(){
  var name=document.getElementById('profName').value;var phone=document.getElementById('profPhone').value;
  try{var res=await fetch(API+'/api/customers/profile',{method:'PUT',headers:authH(),body:JSON.stringify({name,phone})});var data=await res.json();if(data.success){customer.name=name;customer.phone=phone;localStorage.setItem('mr_customer',JSON.stringify(customer));showToast('Profile updated!');initUser();}else showToast('Failed');}catch(e){showToast('Error');}
}
function doLogout(){localStorage.removeItem('mr_customer_token');localStorage.removeItem('mr_customer');window.location.href='index.html';}
initUser();loadOrders();
</script>
<script src="/js/pwa.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
</html>
