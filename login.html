<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register — Major Rangas</title>
  <meta name="description" content="Login or create your Major Rangas account to track orders, save addresses and manage your wishlist.">
  <meta name="keywords" content="major rangas login, major rangas account">
  <meta name="author" content="Major Rangas">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://majorrangas.in/login.html">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Major Rangas">
  <meta property="og:title" content="My Account — Major Rangas">
  <meta property="og:description" content="Login to your Major Rangas account.">
  <meta property="og:url" content="https://majorrangas.in/login.html">
  <meta property="og:image" content="https://majorrangas.in/images/logo.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Account — Major Rangas">
  <meta name="twitter:description" content="Login to your Major Rangas account.">
  <meta name="twitter:image" content="https://majorrangas.in/images/logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="apple-touch-icon" href="/images/logo.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{--gold:#C9830A;--teal:#0D9B8A;--teal-light:#12B5A2;--teal-bg:#E8F8F6;--white:#fff;--off-white:#FAFAF8;--cream:#F7F3EE;--text:#1A1A1A;--text2:#555;--text3:#888;--border:#E8E4DC;--shadow:0 2px 12px rgba(0,0,0,0.08);--font-serif:'Playfair Display',serif;--font-sans:'Inter',sans-serif;}
    body{background:var(--bg);font-family:var(--font-sans);min-height:100vh;display:flex;flex-direction:column;}
    a{text-decoration:none;color:inherit;}
    .announce{background:var(--gold);color:#fff;text-align:center;font-size:0.8rem;font-weight:600;padding:10px 20px;}
    .navbar{background:var(--nav-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);box-shadow:var(--shadow);}
    .nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;}
    .logo-main{font-family:var(--font-serif);font-size:1.4rem;color:var(--text);font-weight:700;letter-spacing:2px;}
    .logo-sub{font-size:0.6rem;color:var(--text3);letter-spacing:3px;text-transform:uppercase;display:block;text-align:center;}
    .back-link{color:var(--teal);font-size:0.82rem;font-weight:500;}

    .login-page{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
    .login-card{background:var(--white);border-radius:20px;overflow:hidden;width:100%;max-width:480px;box-shadow:0 8px 40px rgba(0,0,0,0.12);display:grid;grid-template-columns:1fr 1fr;}
    .login-left{background:var(--teal);padding:40px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
    .login-left-logo{font-family:var(--font-serif);font-size:1.5rem;color:#fff;margin-bottom:8px;}
    .login-left-sub{color:rgba(255,255,255,0.7);font-size:0.82rem;margin-bottom:24px;}
    .login-left-icon{font-size:3rem;margin-bottom:12px;}
    .login-benefits{list-style:none;text-align:left;margin-top:12px;}
    .login-benefits li{color:rgba(255,255,255,0.7);font-size:0.75rem;padding:5px 0;display:flex;align-items:center;gap:8px;}
    .login-benefits li::before{content:'✓';color:#fff;font-weight:700;}

    .login-right{padding:32px 24px;}
    .login-tabs{display:flex;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:22px;}
    .login-tab{flex:1;padding:9px;background:none;border:none;font-size:0.82rem;font-weight:500;cursor:pointer;color:var(--text2);transition:all 0.2s;}
    .login-tab.active{background:var(--teal);color:#fff;font-weight:600;}
    .login-section{display:none;}
    .login-section.active{display:block;}
    .inp-group{margin-bottom:13px;}
    .inp-group label{display:block;font-size:0.75rem;font-weight:500;color:var(--text2);margin-bottom:5px;}
    .inp{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:0.88rem;color:var(--text);outline:none;font-family:var(--font-sans);transition:border-color 0.2s;}
    .inp:focus{border-color:var(--teal);}
    .btn-submit{width:100%;background:var(--teal);color:#fff;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:0.9rem;cursor:pointer;transition:background 0.2s;margin-top:4px;}
    .btn-submit:hover{background:var(--teal-light);}
    .divider{text-align:center;color:var(--text3);font-size:0.75rem;margin:14px 0;position:relative;}
    .divider::before,.divider::after{content:'';position:absolute;top:50%;width:38%;height:1px;background:var(--border);}
    .divider::before{left:0;}.divider::after{right:0;}
    .google-btn{width:100%;border:1.5px solid var(--border);background:var(--white);padding:11px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:0.85rem;font-weight:500;cursor:pointer;transition:all 0.2s;color:var(--text);}
    .google-btn:hover{border-color:var(--teal);background:var(--teal-bg);}
    .err-msg{color:#E53935;font-size:0.75rem;margin-top:6px;display:none;}
    .success-msg{color:var(--teal);font-size:0.75rem;margin-top:6px;display:none;}
    .wa-float{position:fixed;bottom:28px;right:28px;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;z-index:5000;box-shadow:0 4px 16px rgba(37,211,102,0.4);text-decoration:none;}
    @media(max-width:560px){.login-card{grid-template-columns:1fr;}.login-left{padding:28px 20px;}.login-left-logo{font-size:1.2rem;}.login-benefits{display:none;}}
  </style>
  <script src="js/theme.js"></script>
</head>
<body>
<div class="announce">🎉 Free Shipping on orders above ₹500!</div>
<nav class="navbar">
  <div class="nav-inner" style="justify-content:flex-start;gap:24px">
    <a href="index.html" style="flex-shrink:0"><div style="background:#1A1A1A;padding:6px 18px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center">
        <img src="images/logo.png" alt="Major Rangas" style="height:32px;width:auto;display:block;max-width:none">
      </div></a>
    <a href="index.html" style="color:var(--teal);font-size:0.82rem;font-weight:500">← Back to Store</a>
    <a href="products.html" style="color:var(--teal);font-size:0.82rem;font-weight:500;margin-left:auto">Browse Products</a>
  </div>
</nav>

<div class="login-page">
  <div class="login-card">
    <div class="login-left">
      <div class="login-left-icon">🙏</div>
      <div class="login-left-logo">Major Rangas</div>
      <div class="login-left-sub">True Taste of South India</div>
      <ul class="login-benefits">
        <li>Track your orders</li>
        <li>Save addresses</li>
        <li>Wishlist products</li>
        <li>Faster checkout</li>
      </ul>
    </div>
    <div class="login-right">
      <div class="login-tabs">
        <button class="login-tab active" onclick="switchTab('login',this)">Login</button>
        <button class="login-tab" onclick="switchTab('register',this)">Register</button>
      </div>

      <!-- LOGIN -->
      <div class="login-section active" id="loginSection">
        <div class="inp-group"><label>Email Address</label><input class="inp" type="email" id="loginEmail" placeholder="your@email.com"></div>
        <div class="inp-group"><label>Password</label><input class="inp" type="password" id="loginPass" placeholder="Your password"></div>
        <div class="err-msg" id="loginErr"></div>
        <button class="btn-submit" onclick="doLogin()">Login →</button>
        <div class="divider">OR</div>
        <button class="google-btn" onclick="googleSignIn()">
          <img src="https://www.google.com/favicon.ico" width="16" alt="G"> Continue with Google
        </button>
      </div>

      <!-- REGISTER -->
      <div class="login-section" id="registerSection">
        <div class="inp-group"><label>Full Name</label><input class="inp" type="text" id="regName" placeholder="Your name"></div>
        <div class="inp-group"><label>Email Address</label><input class="inp" type="email" id="regEmail" placeholder="your@email.com"></div>
        <div class="inp-group"><label>Phone Number</label><input class="inp" type="tel" id="regPhone" placeholder="10-digit mobile"></div>
        <div class="inp-group"><label>Password</label><input class="inp" type="password" id="regPass" placeholder="Minimum 6 characters"></div>
        <div class="err-msg" id="regErr"></div>
        <button class="btn-submit" onclick="doRegister()">Create Account →</button>
        <div class="divider">OR</div>
        <button class="google-btn" onclick="googleSignIn()">
          <img src="https://www.google.com/favicon.ico" width="16" alt="G"> Continue with Google
        </button>
      </div>
    </div>
  </div>
</div>

<a href="https://wa.me/919500865686" target="_blank" class="wa-float">💬</a>

<script>
var API='https://majorrangas-backend-production.up.railway.app';
if(localStorage.getItem('mr_customer_token')) window.location.href='account.html';

function switchTab(tab,btn){
  document.querySelectorAll('.login-tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.login-section').forEach(function(s){s.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById(tab+'Section').classList.add('active');
}

function showErr(id,msg){var el=document.getElementById(id);el.textContent=msg;el.style.display='block';setTimeout(function(){el.style.display='none';},4000);}

function redirect(){
  var r=new URLSearchParams(window.location.search).get('redirect')||'account.html';
  window.location.href=r;
}

async function doLogin(){
  var email=document.getElementById('loginEmail').value.trim();
  var pass=document.getElementById('loginPass').value;
  if(!email||!pass){showErr('loginErr','Please fill all fields');return;}
  try{
    var res=await fetch(API+'/api/customers/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    var data=await res.json();
    if(data.success){localStorage.setItem('mr_customer_token',data.token);localStorage.setItem('mr_customer',JSON.stringify(data.customer));redirect();}
    else showErr('loginErr',data.error||'Login failed');
  }catch(e){showErr('loginErr','Connection error. Try again.');}
}

async function doRegister(){
  var name=document.getElementById('regName').value.trim();
  var email=document.getElementById('regEmail').value.trim();
  var phone=document.getElementById('regPhone').value.trim();
  var pass=document.getElementById('regPass').value;
  if(!name||!email||!pass){showErr('regErr','Please fill all required fields');return;}
  if(pass.length<6){showErr('regErr','Password must be at least 6 characters');return;}
  try{
    var res=await fetch(API+'/api/customers/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,phone,password:pass})});
    var data=await res.json();
    if(data.success){localStorage.setItem('mr_customer_token',data.token);localStorage.setItem('mr_customer',JSON.stringify(data.customer));redirect();}
    else showErr('regErr',data.error||'Registration failed');
  }catch(e){showErr('regErr','Connection error. Try again.');}
}

function googleSignIn(){alert('Google Sign-In coming soon! Please use Email & Password for now.');}
</script>
</body>
</html>
